<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 手机端核心适配代码，必须保留 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>手机光影记事本</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* 禁止手机长按选中、拖拽卡顿 */
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            min-height: 100vh;
            min-height: 100dvh;
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(-45deg, #f0f4ff, #e8f4fd, #f5f0ff, #fef5f8);
            background-size: 400% 400%;
            animation: bgGradient 12s ease infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
            overflow-x: hidden;
        }
        @keyframes bgGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        .title {
            font-size: 24px;
            background: linear-gradient(135deg, #409eff, #722ed1);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 20px;
            animation: float 4s ease-in-out infinite;
            letter-spacing: 1px;
            text-align: center;
        }
        .title::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -6px;
            transform: translateX(-50%);
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, #409eff, #722ed1);
            border-radius: 3px;
            animation: lineScale 3s ease-in-out infinite alternate;
        }
        @keyframes float {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        @keyframes lineScale {
            0% { width: 60px; opacity: 0.6; }
            100% { width: 100px; opacity: 1; }
        }
        .box {
            width: 100%;
            border-radius: 16px;
            background: rgba(255,255,255,0.9);
            box-shadow: 0 6px 20px rgba(31, 38, 135, 0.12);
            animation: fadeUp 1s ease;
            transition: 0.4s ease;
            position: relative;
            overflow: hidden;
        }
        .box::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);
            animation: sweep 4s ease-in-out infinite;
        }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes sweep {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        textarea {
            width: 100%;
            height: 68dvh;
            padding: 20px;
            border: none;
            outline: none;
            background: transparent;
            font-size: 16px;
            line-height: 1.8;
            color: #333;
            resize: none;
            border-radius: 16px;
            caret-color: #409eff;
            transition: 0.3s;
            /* 手机允许选文字、输入 */
            -webkit-user-select: text;
            user-select: text;
        }
        textarea:focus {
            box-shadow: inset 0 0 15px rgba(100,149,237,0.12);
        }
        textarea::placeholder {
            color: #b0bacc;
            font-size: 15px;
        }
        .btn-wrap {
            margin-top: 18px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 30px;
            border-radius: 50px;
            border: none;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 12px rgba(64,158,255,0.2);
        }
        .save-btn {
            background: linear-gradient(135deg,#409eff,#66b1ff);
            color: #fff;
        }
        .clear-btn {
            background: #fff;
            color: #409eff;
            border: 1px solid #409eff;
        }
        .tip {
            margin-top: 20px;
            color: #718096;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>
<body>
    <canvas id="particles"></canvas>
    <h2 class="title">手机光影记事本</h2>
    <div class="box">
        <textarea id="textArea" placeholder="手机端随时记录文字、心情、笔记，内容自动保存..."></textarea>
    </div>
    <div class="btn-wrap">
        <button class="btn save-btn" onclick="saveTxt()">保存文字</button>
        <button class="btn clear-btn" onclick="clearTxt()">清空内容</button>
    </div>
    <p class="tip">✨ 手机完美适配 · 输入法不遮挡 · 自动存档</p>

    <script>
        const canvas = document.getElementById("particles");
        const ctx = canvas.getContext("2d");
        let w, h;
        let list = [];

        function resize() {
            w = window.innerWidth;
            h = window.innerHeight;
            canvas.width = w;
            canvas.height = h;
        }
        resize();
        window.addEventListener("resize", resize);

        function Particle(){
            this.x = Math.random() * w;
            this.y = Math.random() * h;
            this.r = Math.random() * 2 + 1;
            this.sx = Math.random() * 0.4 - 0.2;
            this.sy = Math.random() * 0.4 - 0.2;
            this.color = "rgba(64,158,255,0.25)";
        }
        Particle.prototype.move = function(){
            if(this.x < 0 || this.x > w) this.sx *= -1;
            if(this.y < 0 || this.y > h) this.sy *= -1;
            this.x += this.sx;
            this.y += this.sy;
        };
        Particle.prototype.draw = function(){
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
            ctx.fillStyle = this.color;
            ctx.fill();
        };

        function init(){
            list = [];
            for(let i = 0; i < 40; i++){
                list.push(new Particle());
            }
        }
        function render(){
            ctx.clearRect(0,0,w,h);
            for(let i = 0; i < list.length; i++){
                list[i].move();
                list[i].draw();
            }
            requestAnimationFrame(render);
        }
        init();
        render();

        const textArea = document.getElementById("textArea");
        window.onload = function(){
            textArea.value = localStorage.getItem("mobileNote") || "";
        };
        textArea.oninput = function(){
            localStorage.setItem("mobileNote", this.value);
        };

        function saveTxt(){
            alert("✅ 已自动保存！");
        }
        function clearTxt(){
            textArea.value = "";
            localStorage.removeItem("mobileNote");
        }
    </script>
</body>
</html>
